<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖼️ Subir Imagen · observatorio</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-green: #0aff0a;
            --neon-red: #ff003c;
            --neon-yellow: #ffee00;
            --neon-purple: #bd00ff;
            --bg-dark: #0a0a0f;
            --bg-terminal: #0d1117;
            --border: #30363d;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: var(--bg-dark); color: #c9d1d9; min-height: 100vh; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--neon-blue); padding-bottom: 20px; }
        .glitch-title { font-size: 2.5rem; color: var(--neon-blue); text-shadow: 2px 0 var(--neon-red), -2px 0 var(--neon-purple); animation: glitch 2s infinite; }
        @keyframes glitch {
            0%, 90%, 100% { text-shadow: 2px 0 var(--neon-red), -2px 0 var(--neon-purple); }
            92% { text-shadow: -2px 0 var(--neon-red), 2px 0 var(--neon-purple); }
            94% { text-shadow: 2px 0 var(--neon-purple), -2px 0 var(--neon-red); }
        }
        .subheader { color: var(--neon-green); margin-top: 10px; font-size: 1.1rem; }
        .volver { margin-bottom: 20px; }
        .volver a { color: var(--neon-blue); text-decoration: none; font-weight: bold; transition: all 0.3s; }
        .volver a:hover { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
        
        .editor-controls { max-width: 600px; margin: 0 auto 30px; text-align: center; }
        .btn-editor { background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple)); border: 2px solid var(--neon-blue); color: white; padding: 12px 24px; font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; transition: all 0.3s; }
        .btn-editor:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
        .terminal { background: var(--bg-terminal); border: 1px solid var(--border); border-radius: 10px; padding: 30px; max-width: 600px; margin: 0 auto 30px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.1); }
        label { display: block; color: var(--neon-yellow); margin: 15px 0 5px; font-weight: bold; }
        input[type="text"], input[type="url"], textarea, select { width: 100%; background: #010409; border: 1px solid var(--border); color: #c9d1d9; padding: 12px; border-radius: 6px; font-family: inherit; font-size: 14px; transition: all 0.3s; }
        input[type="text"]:focus, input[type="url"]:focus, textarea:focus, select:focus { outline: none; border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }
        input[type="file"] { display: none; }
        .file-label { display: block; background: linear-gradient(45deg, #21262d, #30363d); border: 2px dashed var(--neon-blue); color: var(--neon-blue); padding: 40px 20px; text-align: center; border-radius: 10px; cursor: pointer; transition: all 0.3s; margin: 10px 0; }
        .file-label:hover { background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); transform: translateY(-2px); }
        .file-label::before { content: "🖼️ "; font-size: 2rem; }
        
        .preview-container { background: #010409; border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin: 15px 0; text-align: center; }
        img.preview-img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }
        
        .btn-success, .btn-secondary, .btn-danger { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; transition: all 0.3s; text-transform: uppercase; }
        .btn-success { background: linear-gradient(45deg, #238636, #2ea043); color: white; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(35, 134, 54, 0.5); }
        .btn-secondary { background: linear-gradient(45deg, #6e7681, #8b949e); color: white; }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(110, 118, 129, 0.5); }
        .btn-danger { background: linear-gradient(45deg, #da3633, #f85149); color: white; padding: 8px 16px; font-size: 0.9rem; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(218, 54, 51, 0.5); }
        
        .existing-media { max-width: 1000px; margin: 0 auto; }
        .section-title { color: var(--neon-purple); font-size: 1.5rem; margin-bottom: 20px; text-align: center; text-shadow: 0 0 10px rgba(189, 0, 255, 0.3); }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .media-card { background: var(--bg-terminal); border: 1px solid var(--border); border-radius: 10px; padding: 20px; transition: all 0.3s; position: relative; overflow: hidden; }
        .media-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); }
        .media-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0, 243, 255, 0.2); border-color: var(--neon-blue); }
        .media-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .media-icon { font-size: 2rem; }
        .media-title { color: var(--neon-green); font-size: 1.1rem; font-weight: bold; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .media-meta { color: #8b949e; font-size: 0.85rem; margin-bottom: 10px; }
        .media-description { color: #c9d1d9; font-size: 0.9rem; line-height: 1.4; margin-bottom: 15px; }
        .media-player-container { background: #010409; border-radius: 8px; padding: 10px; border: 1px solid var(--border); text-align: center; }
        .media-player-container img { max-width: 100%; border-radius: 4px; }
        
        .labels { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .label { background: rgba(0, 243, 255, 0.2); color: var(--neon-blue); padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--neon-blue); }
        .label.genero { background: rgba(189, 0, 255, 0.2); color: var(--neon-purple); border-color: var(--neon-purple); }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; margin-left: 10px; text-transform: uppercase; }
        .status-protected { background: rgba(255, 0, 60, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="glitch-title">~/observatorio/imagen $</h1>
        <p class="subheader">> Galería visual y gráfica colaborativa</p>
    </div>

    <div class="volver">
        <a href="/">← INICIO</a>
    </div>

    <!-- Controles Editor -->
    <div class="editor-controls">
        <button onclick="mostrarSelector()" id="btnMostrarEditor" class="btn-editor">🔒 ACCEDER AL UPLOADER</button>
        <div id="statusIndicator" style="margin-top: 10px; display: none;">
            <span class="status-badge status-protected">MODO EDITOR ACTIVO</span>
        </div>
    </div>

    <!-- Formulario Protegido -->
    <div id="panelUpload" class="terminal" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">
            <span style="color: var(--neon-green); font-weight: bold;">📝 NUEVA IMAGEN</span>
            <button onclick="cerrarEditor()" class="btn-danger" style="padding: 5px 10px; font-size: 0.8rem;">✖ CERRAR</button>
        </div>

        <form onsubmit="event.preventDefault(); subirArchivo();">
            <label>📌 TÍTULO:</label>
            <input type="text" id="titulo" placeholder="Título de la imagen" required>
            <label>🎨 ARTISTA/CREADOR:</label>
            <input type="text" id="artista" placeholder="Nombre del artista">
            <label>🆔 QID (Wikidata):</label>
            <input type="text" id="qid" placeholder="Q123456">
            <label>📝 DESCRIPCIÓN / PROMPT:</label>
            <textarea id="descripcion" rows="2" placeholder="Descripción o prompt utilizado..."></textarea>
            <label>🏷️ GÉNERO/TIPO:</label>
            <select id="genero">
                <option value="ai-art">🤖 Arte IA</option>
                <option value="fotografia">📸 Fotografía</option>
                <option value="ilustracion">🖌️ Ilustración / Vector</option>
                <option value="textura">🧱 Textura / Material</option>
                <option value="otro">🔧 Otro</option>
            </select>
            <label>🔗 URL EXTERNA (opcional):</label>
            <input type="url" id="urlExterna" placeholder="https://...">
            <label>🖼️ SELECCIONAR ARCHIVO:</label>
            <label for="archivo" class="file-label" id="fileLabel">Haz clic para seleccionar imagen</label>
            <input type="file" id="archivo" accept="image/jpeg,image/png,image/webp,image/gif" onchange="previsualizar(this)">
            
            <div id="vistaPrevia" class="preview-container" style="display: none;">
                <img id="imagePreview" class="preview-img" src="" alt="Vista previa">
                <p style="margin-top: 10px;"><span id="fileInfo" style="color: var(--neon-green);"></span></p>
                <p><button type="button" onclick="quitarArchivo()" class="btn-danger">✖ QUITAR</button></p>
            </div>

            <div id="progressContainer" style="display: none; margin-top: 15px;">
                <div style="width: 100%; background: #010409; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;">
                    <div id="progressBar" style="width: 0%; height: 15px; background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); box-shadow: 0 0 10px var(--neon-blue); transition: width 0.2s ease;"></div>
                </div>
                <small id="progressText" style="text-align: center; color: var(--neon-green); margin-top: 5px; display: block;">0% ENVIADO</small>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn-success">🚀 SUBIR A CLOUDFLARE</button>
                <button type="button" onclick="resetForm()" class="btn-secondary">↩ LIMPIAR</button>
            </div>
        </form>
    </div>

    <div class="existing-media">
        <h2 class="section-title">📚 Galería del Observatorio</h2>
        
        <div class="media-grid" id="mediaContainer">
            
            <!-- VIDEO 1 ESTÁTICO ADAPTADO A IMAGEN -->
            <div class="media-card">
                <div class="media-card-header">
                    <span class="media-icon">🤖</span>
                    <h3 class="media-title">Autoretrato Generativo</h3>
                </div>
                <div class="media-meta">
                    <span>🎨 Paula</span>
                    <span>☁️ Cloudflare R2</span>
                </div>
                <div class="media-description">Fusión de imagen propia y texturas cyberpunk generadas mediante IA.</div>
                
                <div class="media-player-container">
                    <img src="https://via.placeholder.com/400x300/0d1117/00f3ff?text=Imagen+IA+Modelo+Propio" alt="Autoretrato">
                </div>
                
                <div class="labels">
                    <span class="label genero">ai-art</span>
                    <span class="label">Composición</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        const CLAVE_EDITOR = 'patito123';
        const GITHUB_USER = 'paulaflechadadeai';
        const GITHUB_REPO = 'paulaflechadadeai.github.io';
        const WORKER_URL = 'https://observatorio-upload.veronicakamyarnima.workers.dev';

        let editorActivo = false;
        let archivoSeleccionado = null;

        function mostrarSelector() {
            const clave = prompt("🔑 Ingresa clave de editor:");
            if (clave === CLAVE_EDITOR) activarModoEditor();
            else if (clave !== null) alert("❌ Clave incorrecta. Acceso denegado.");
        }

        function activarModoEditor() {
            editorActivo = true;
            document.getElementById('btnMostrarEditor').style.display = 'none';
            document.getElementById('panelUpload').style.display = 'block';
            document.getElementById('statusIndicator').style.display = 'block';
        }

        function cerrarEditor() {
            editorActivo = false;
            document.getElementById('btnMostrarEditor').style.display = 'inline-block';
            document.getElementById('panelUpload').style.display = 'none';
            document.getElementById('statusIndicator').style.display = 'none';
            resetForm();
        }

        function resetForm() {
            document.getElementById('titulo').value = '';
            document.getElementById('artista').value = '';
            document.getElementById('qid').value = '';
            document.getElementById('descripcion').value = '';
            document.getElementById('urlExterna').value = '';
            document.getElementById('genero').value = 'ai-art';
            quitarArchivo();
        }

        function previsualizar(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
                if (!allowedTypes.includes(file.type)) {
                    alert("❌ Formato no soportado. Usa JPG, PNG, WEBP o GIF."); 
                    input.value = ''; return;
                }
                if (file.size > 20 * 1024 * 1024) {
                    alert("❌ La imagen debe ser menor de 20MB"); 
                    input.value = ''; return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    archivoSeleccionado = { nombre: file.name, tamaño: (file.size / (1024 * 1024)).toFixed(2) };
                    const img = document.getElementById('imagePreview');
                    img.src = e.target.result;
                    document.getElementById('fileInfo').textContent = `📊 ${archivoSeleccionado.nombre} (${archivoSeleccionado.tamaño} MB)`;
                    document.getElementById('vistaPrevia').style.display = 'block';
                    document.getElementById('fileLabel').style.borderColor = 'var(--neon-green)';
                };
                reader.readAsDataURL(file);
            }
        }

        function quitarArchivo() {
            archivoSeleccionado = null;
            document.getElementById('vistaPrevia').style.display = 'none';
            document.getElementById('archivo').value = '';
            document.getElementById('imagePreview').src = '';
            document.getElementById('fileLabel').style.borderColor = 'var(--neon-blue)';
        }

        function subirArchivo() {
            if (!editorActivo) return;
            
            const titulo = document.getElementById('titulo').value.trim();
            const artista = document.getElementById('artista').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim();
            const genero = document.getElementById('genero').value;
            const urlExterna = document.getElementById('urlExterna').value.trim();
            const archivoInput = document.getElementById('archivo');

            if (!titulo) { alert("⚠️ El título es obligatorio"); return; }

            if (archivoInput.files && archivoInput.files[0]) {
                const file = archivoInput.files[0];
                const formData = new FormData();
                formData.append('file', file);
                formData.append('titulo', titulo);
                formData.append('genero', genero);

                const btn = document.querySelector('button[type="submit"]');
                const originalText = btn.innerText;
                btn.innerText = '⏳ TRANSMITIENDO...';
                btn.disabled = true;

                const progressContainer = document.getElementById('progressContainer');
                const progressBar = document.getElementById('progressBar');
                const progressText = document.getElementById('progressText');
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                
                const xhr = new XMLHttpRequest();
                xhr.open('POST', WORKER_URL, true);

                xhr.upload.onprogress = function(e) {
                    if (e.lengthComputable) {
                        const percentComplete = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = percentComplete + '%';
                        progressText.innerText = percentComplete + '% ENVIADO';
                    }
                };

                xhr.onload = function() {
                    btn.innerText = originalText;
                    btn.disabled = false;
                    progressContainer.style.display = 'none';

                    if (xhr.status >= 200 && xhr.status < 300) {
                        const result = JSON.parse(xhr.responseText);
                        let cuerpo = `**Género:** ${genero}\n`;
                        if (artista) cuerpo += `🎨 **Artista:** ${artista}\n`;
                        cuerpo += `\n${descripcion || 'Sin descripción'}\n\n`;
                        cuerpo += `🔗 **URL R2 Pública:** ${result.url}\n`;
                        
                        window.open(`https://github.com/${GITHUB_USER}/${GITHUB_REPO}/issues/new?title=${encodeURIComponent('🖼️ ' + titulo)}&body=${encodeURIComponent(cuerpo)}&labels=imagen,${genero}`, '_blank');
                        resetForm();
                    } else {
                        alert(`❌ Error al subir`);
                    }
                };
                xhr.send(formData);
            } else if (urlExterna) {
                let cuerpo = `**Género:** ${genero}\n`;
                if (artista) cuerpo += `🎨 **Artista:** ${artista}\n`;
                cuerpo += `\n${descripcion || 'Sin descripción'}\n\n🔗 **Ver enlace externo:** [Enlace](${urlExterna})\n`;
                window.open(`https://github.com/${GITHUB_USER}/${GITHUB_REPO}/issues/new?title=${encodeURIComponent('🖼️ ' + titulo)}&body=${encodeURIComponent(cuerpo)}&labels=imagen,${genero}`, '_blank');
                resetForm();
            } else {
                alert("⚠️ Sube un archivo o proporciona una URL");
            }
        }

        async function cargarGaleriaDinamica() {
            const contenedor = document.getElementById('mediaContainer');
            try {
                // Filtramos específicamente por la etiqueta 'imagen'
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open&labels=imagen`);
                const issues = await response.json();
                
                issues.forEach(issue => {
                    const urlMatch = issue.body.match(/URL R2 Pública:\*\* (https:\/\/[^\s]+)/);
                    const urlR2 = urlMatch ? urlMatch[1] : null;

                    if (urlR2) {
                        const tituloLimpio = issue.title.replace('🖼️ ', '');
                        const cardHTML = `
                        <div class="media-card">
                            <div class="media-card-header">
                                <span class="media-icon">🖼️</span>
                                <h3 class="media-title">${tituloLimpio}</h3>
                            </div>
                            <div class="media-meta"><span>☁️ Cloudflare R2</span> <span>#${issue.number}</span></div>
                            <div class="media-player-container">
                                <img src="${urlR2}" alt="${tituloLimpio}">
                            </div>
                            <div style="margin-top: 15px; text-align: center;">
                                <a href="${issue.html_url}" target="_blank" style="color: var(--neon-blue); text-decoration: none; font-size: 0.8rem; border: 1px solid var(--neon-blue); padding: 4px 8px; border-radius: 4px;">Ver metadatos completos →</a>
                            </div>
                        </div>`;
                        contenedor.innerHTML += cardHTML;
                    }
                }); 
            } catch (error) { console.error("Error", error); }
        }
        document.addEventListener('DOMContentLoaded', cargarGaleriaDinamica);
    </script>
</body>
</html>
